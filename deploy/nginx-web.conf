# /etc/nginx/sites-available/default on the WEB VM (public subnet)
# Replace APP_VM_PRIVATE_IP with the private IP of the app VM (e.g. 10.0.2.4)
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    # React single-page app
    location / {
        try_files $uri /index.html;
    }

    # API calls go across the VNet to the private subnet
    location /api/ {
        proxy_pass http://APP_VM_PRIVATE_IP:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
    }
}
